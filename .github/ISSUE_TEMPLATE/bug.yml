name: Bug report
description: Report a reproducible non-security bug
body:
  - type: markdown
    attributes:
      value: Do not include passwords, provider credentials or private logs. Use private vulnerability reporting for security issues.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction, version and supported platform details
    validations:
      required: true
